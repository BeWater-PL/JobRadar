server:
  port: 8088

spring:
  application:
    name: jobradar
  datasource:
    # Die Datenbank liegt neben der Anwendung und ueberlebt jeden Neustart.
    url: jdbc:sqlite:${user.home}/.jobradar/jobradar.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
  thymeleaf:
    cache: false

logging:
  # Ohne Konsolenfenster ist die Datei die einzige Spur - deshalb fest verdrahtet.
  file:
    name: ${user.home}/.jobradar/jobradar.log
  logback:
    rollingpolicy:
      max-history: 7
  level:
    de.bewater.jobradar: INFO
    org.hibernate.SQL: WARN

jobradar:
  # Laeuft morgens um 8 und nachmittags um 17 Uhr.
  zeitplan: "0 0 8,17 * * *"
  max-alter-tage: 2

  arbeitsagentur:
    basis-url: https://rest.arbeitsagentur.de/jobboerse/jobsuche-service
    api-key: jobboerse-jobsuche
    jobdetail-basis: https://www.arbeitsagentur.de/jobsuche/jobdetail/

  # Karriere-Feeds einzelner Arbeitgeber (JSON). "aktiv: false" schaltet eine
  # Quelle ab, ohne sie zu loeschen. Endpunkte und Header stammen aus
  # JobRadar_Feed-Recherche.md - aendert ein Arbeitgeber sein Bewerbersystem,
  # muss nur diese Datei angepasst werden.
  #
  # altersfilter: false = max-alter-tage gilt fuer diese Quelle nicht. Noetig,
  # wo der Feed kein echtes Veroeffentlichungsdatum liefert (Anlagedatum) oder
  # Anzeigen monatelang unveraendert fuehrt - sonst kaeme nie etwas durch.
  # Wiederholungen verhindert der Fingerabdruck trotzdem.
  quellen:
    interamt:
      aktiv: true
      # Eingestellt-Datum stimmt, aber Behoerden schreiben selten neu aus - mit Filter kam nichts durch.
      altersfilter: false
      # Stellenportal des oeffentlichen Dienstes. Liefert nur je Partner-ID:
      # 1714 = Stadt Wuppertal, 2732 = Gebaeudemanagement Stadt Wuppertal, 1409 = Jobcenter Wuppertal
      url: https://interamt.de/koop/app/webservice_v2?partner={partner}
      partner-ids: [1714, 2732, 1409]
    wupperverband:
      aktiv: true
      # startDate ist der Beginn der Schaltung, oft Wochen alt.
      altersfilter: false
      url: https://karriere.wupperverband.de/jobPublication/list.json
      firma: Wupperverband
    gothaer:
      aktiv: true
      # releasedDate ist ein echtes Veroeffentlichungsdatum, taeglich Neues.
      altersfilter: true
      # SmartRecruiters, konzernweit ~400 Stellen; es werden nur die in Deutschland uebernommen.
      url: https://api.smartrecruiters.com/v1/companies/BarmeniaGothaerAG/postings
      limit: 100
    riedel:
      # Feed abgeschaltet: riedel.net/jobs.json liefert seit 09/2026 404,
      # Riedel laeuft jetzt ueber ein softgarden-Board ohne JSON-Feed.
      aktiv: false
      # jobStartDate ist ein Anlagedatum.
      altersfilter: false
      url: https://www.riedel.net/jobs.json
      firma: Riedel Communications
    knipex:
      aktiv: true
      # Anzeigen bleiben monatelang im Feed.
      altersfilter: false
      url: https://karriere.knipex.de/jobs.feed.json
      firma: Knipex
    schmersal:
      aktiv: true
      # published_at liegt oft Monate zurueck.
      altersfilter: false
      url: https://schmersal.onlyfy.io/job/list/8b38kyrbny9hfkkhxzedhvrhnm979rq?format=json&max_results=100
      firma: K.A. Schmersal GmbH & Co. KG
    erfurt:
      aktiv: true
      # enabledDate ist Kampagnenstart, Anzeigen laufen lange.
      altersfilter: false
      # Talention: POST mit JSON-Body, GET antwortet 405.
      url: https://jobs.erfurt.com/talention/api/3.2/job
      firma: Erfurt & Sohn
    bilstein:
      aktiv: true
      # erstelltAm ist ein Anlagedatum.
      altersfilter: false
      url: https://bilsteingroup.com/api/guidecom/api/v2/offersummaries
      firma: bilstein group
      # Ohne diesen Header liefert der Proxy eine HTML-Debugseite statt JSON.
      header:
        Accept: application/json
    aptiv:
      aktiv: true
      # postedOn ist nur relativer Text ("vor 30+ Tagen") - kein verlaessliches Datum.
      altersfilter: false
      # Workday CXS-API, POST mit JSON-Body, max. 20 je Seite. Standort-Filter
      # wird bei jedem Lauf aus den Facets gelesen (IDs koennen sich aendern).
      url: https://aptiv.wd5.myworkdayjobs.com/wday/cxs/aptiv/APTIV_CAREERS/jobs
      link-basis: https://aptiv.wd5.myworkdayjobs.com/de-DE/APTIV_CAREERS
      firma: Aptiv
    codecentric:
      aktiv: true
      # createdAt ist das Anlagedatum, Stellen laufen lange.
      altersfilter: false
      # Personio-XML-Feed. Standort Solingen, dazu Remote.
      url: https://codecentric.jobs.personio.de/xml?language=de
      firma: codecentric
    mail:
      # Job-Alert-Mails von Indeed, StepStone, kimeta und meinestadt per IMAP.
      # Zugangsdaten NICHT hier eintragen, sondern als Umgebungsvariablen:
      #   JOBRADAR_MAIL_USER      = vollstaendige Mailadresse des Postfachs
      #   JOBRADAR_MAIL_PASSWORT  = Passwort (IMAP muss beim Anbieter freigeschaltet sein)
      #   JOBRADAR_MAIL_HOST      = IMAP-Server des Anbieters, z. B. imap.beispielprovider.de
      # Fehlen sie, bleibt die Quelle still. Nur ungelesene Mails werden gelesen
      # und danach als gelesen markiert; fremde Mails bleiben ungelesen liegen.
      aktiv: true
      host: ${JOBRADAR_MAIL_HOST:}
      port: 993
      ordner: INBOX
      # Datum = Versanddatum der Mail; liegen Mails laenger ungelesen, sollen sie trotzdem zaehlen.
      altersfilter: false

  profile:
    - name: Anwendungsentwickler Wuppertal
      was: Anwendungsentwickler
      wo: Wuppertal
      umkreis: 15
      arbeitszeit: vz
    - name: Softwareentwickler Wuppertal
      was: Softwareentwickler
      wo: Wuppertal
      umkreis: 15
      arbeitszeit: vz
    - name: Java Entwickler Wuppertal
      was: Java Entwickler
      wo: Wuppertal
      umkreis: 15
      arbeitszeit: vz
    - name: Fachinformatiker Anwendungsentwicklung Wuppertal
      was: Fachinformatiker Anwendungsentwicklung
      wo: Wuppertal
      umkreis: 15
      arbeitszeit: vz
    - name: Softwareentwickler Remote deutschlandweit
      was: Softwareentwickler
      wo: ""
      umkreis: 200
      arbeitszeit: ho
    - name: Informatiker Wuppertal
      was: Informatiker
