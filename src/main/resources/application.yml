      arbeitszeit: vz
    - name: Java Entwickler Remote deutschlandweit
      was: Java Entwickler
      wo: ""
      umkreis: 200
      arbeitszeit: ho

  # Ein einziges dieser Worte im Titel und die Anzeige ist raus.
  ausschluss-worte:
    - senior
    - lead
    - principal
    - expert
    - teamleiter
    - teamleitung
    - architekt
    - ausbildung
    - praktikum
    - werkstudent
    - duales studium
    - dualer student
    - abschlussarbeit
    - bachelorarbeit
    - masterarbeit

  # Mindestens eines davon muss im Titel stehen - sonst ist es keine
  # Entwicklerstelle (Arbeitgeber-Feeds bringen sonst Schlosser und Vertrieb mit).
  # Wortstaemme reichen, verglichen wird als Teilstring: "entwickler" trifft auch
  # "Softwareentwicklerin".
  pflicht-worte:
    - entwickler
    - developer
    - softwareentwickl
    - anwendungsentwickl
    - fachinformatik
    - programmier
    - software engineer
    - software developer
    - systems engineer
    - informatik
    - it-anwendung
    - it-entwickl
    - application
    - frontend
    - backend
    - fullstack

  # Nur diese Orte (Wuppertal und Umland). Anzeigen mit einem anderen Ort werden
  # verworfen - ausser sie sind als Remote/Homeoffice gekennzeichnet. Fehlt der
  # Ort ganz, bleibt die Anzeige drin. Verglichen wird als Teilstring, damit
  # "Wuppertal-Elberfeld" oder "42119 Wuppertal" ebenfalls passen.
  erlaubte-orte:
    - Wuppertal
    - Solingen
    - Remscheid
    - Velbert
    - Ennepetal
    - Schwelm
    - Gevelsberg
    - Sprockhövel
    - Wülfrath
    - Haan
    - Hilden
    - Mettmann
    - Radevormwald
    - Hagen

  # Diese Worte sprechen fuer einen Einstieg.
  einsteiger-worte:
    - junior
    - einsteiger
    - berufseinsteiger
    - absolvent
    - trainee
    - nachwuchs
    - quereinsteiger

  # Aus dem Lebenslauf.
  technologien:
    - java
    - spring
    - python
    - sql
    - javascript
    - typescript
    - html
    - docker
    - linux
    - git
    - backend
    - fullstack
